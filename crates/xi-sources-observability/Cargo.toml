[package]
name                   = "xi-sources-observability"
description            = "This is an internal component crate of xi"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
publish                = true

[features]
default = [ "daemon" ]

# Everything a long-running daemon needs: the ndjson tracing layers, the
# log sinks, the metric registry and the loopback HTTP server. Readers
# (the `xi` CLI) take the crate with `default-features = false` so the
# binary does not link an exporter it never starts.
daemon = [ "dep:prometheus", "dep:tracing-journald", "tracing-subscriber/json" ]

# Opt-in OTLP trace export. Off by default: an export target is an
# operator decision, and the OTLP client stack (opentelemetry,
# opentelemetry_sdk, opentelemetry-otlp, tracing-opentelemetry, plus
# the blocking reqwest HTTP transport they ride on) is dead weight on a
# machine that has no collector. `reqwest-blocking-client` keeps this
# off the async/tokio runtime the rest of the crate does not use.
otlp = [
  "dep:opentelemetry",
  "dep:opentelemetry-otlp",
  "dep:opentelemetry_sdk",
  "dep:reqwest",
  "dep:tracing-opentelemetry",
]

[dependencies]
chrono.workspace              = true
opentelemetry                 = { version = "0.33.1", default-features = false, optional = true, features = [
  "trace",
  # The SDK logs its own export failures through this feature's
  # `otel_error!`/`otel_warn!` macros (as a real `tracing` event, target
  # `opentelemetry_sdk`) rather than through any return value this
  # crate's code sees - `otlp::FailureCounterLayer` is the one way to
  # observe them and is built against this feature being on.
  "internal-logs",
] }
opentelemetry-otlp            = { version = "0.33.1", default-features = false, optional = true, features = [
  "trace",
  "http-proto",
  "reqwest-blocking-client",
] }
opentelemetry_sdk             = { version = "0.33.1", default-features = false, optional = true, features = [
  "trace",
  # `otel_error!`'s `#[cfg(feature = "internal-logs")]` gate resolves
  # against the crate it is textually expanded into (`opentelemetry_sdk`,
  # since that is where `span_processor.rs` calls it) - enabling this
  # feature only on the `opentelemetry` dependency above is not enough;
  # this crate's own same-named feature (which just forwards to
  # `opentelemetry/internal-logs`) has to be on too.
  "internal-logs",
] }
prometheus                    = { default-features = false, optional = true, version = "0.14.0" }
reqwest                       = { optional = true, workspace = true }
rusqlite.workspace            = true
serde.workspace               = true
serde_json.workspace          = true
thiserror.workspace           = true
toml_edit.workspace           = true
tracing.workspace             = true
tracing-opentelemetry         = { version = "0.34.0", optional = true }
tracing-subscriber.workspace  = true
xi-core.workspace             = true

[target.'cfg(unix)'.dependencies]
tracing-journald = { optional = true, version = "0.3.2" }

[dev-dependencies]
serial_test.workspace = true
tempfile.workspace    = true

# Integration tests that exercise `daemon`- or `otlp`-gated modules
# cannot build at all without those features - `cargo test
# --no-default-features` (the "reader" build's own test run; see the
# `daemon` feature's doc comment above) would otherwise fail to compile
# the whole crate's test suite over files that were never reachable from
# a reader build in the first place. `required-features` skips building
# each file's test binary unless the feature it needs is active, the
# same way `#[cfg(feature = "...")]` does inside `src/`.
[[test]]
name                 = "bdd_sources_tracing"
required-features    = [ "daemon" ]

[[test]]
name                 = "bdd_sources_redaction"
required-features    = [ "daemon" ]

[[test]]
name                 = "bdd_sources_metrics_endpoint"
required-features    = [ "daemon" ]

[[test]]
name                 = "bdd_sources_otlp_export"
required-features    = [ "otlp" ]

[lints]
workspace = true
