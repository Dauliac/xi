[package]
name                   = "xi"
license.workspace      = true
repository             = "https://github.com/Dauliac/xi"
description            = "Yet Another Nix Helper"
keywords               = [ "nix", "nixos", "nix-darwin", "helper", "CLI" ]
readme                 = "../../docs/README.md"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
default-run            = "xi"

[dependencies]
anstyle.workspace               = true
clap.workspace                  = true
clap-verbosity-flag.workspace   = true
clap_complete.workspace         = true
clap_complete_nushell.workspace = true
color-eyre.workspace            = true
humantime.workspace             = true
inquire.workspace               = true
nix.workspace                   = true
nix-command.workspace           = true
regex.workspace                 = true
tempfile.workspace              = true
toml_edit.workspace             = true
tracing.workspace               = true
tracing-subscriber.workspace    = true
walkdir.workspace               = true
xi-core.workspace               = true
xi-darwin.workspace             = true
xi-develop.workspace            = true
xi-diff.workspace               = true
xi-flake.workspace              = true
xi-home.workspace               = true
xi-nixos.workspace              = true
xi-search.workspace             = true
yansi.workspace                 = true

[dev-dependencies]
serial_test.workspace = true
tempfile.workspace    = true

[lints]
workspace = true
